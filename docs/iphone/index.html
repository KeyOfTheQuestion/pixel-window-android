<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17121d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>像素窗景</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <main>
    <canvas aria-label="像素窗景。茶书店、街上的行人和骑车人、窗台上的橘猫。" role="img"></canvas>
    <p id="status" role="status">正在打开窗景…</p>
    <p class="orientation">横放手机可放大窗景</p>
    <button id="settings" type="button" aria-haspopup="dialog">光线</button>
  </main>
  <dialog id="options" aria-labelledby="options-title">
    <h1 id="options-title">窗外光线</h1>
    <div class="modes" role="group" aria-label="光线模式">
      <button type="button" data-light="auto" aria-pressed="true">跟随北京日出日落</button>
      <button type="button" data-light="day" aria-pressed="false">白天</button>
      <button type="button" data-light="night" aria-pressed="false">夜晚</button>
    </div>
    <label id="awake-option" hidden><input type="checkbox" id="awake"> 保持亮屏</label>
    <p id="offline-status" role="status" hidden></p>
    <form method="dialog"><button type="submit">完成</button></form>
  </dialog>
</body>
</html>
